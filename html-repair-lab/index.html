<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Home</title>
  </head>

  <body>
    <nav>
      <h1>Tech Club</h1>
      <a href="#about">About</a>
      <a href="#events">Events</a>
      <a href="#join">Join</a>
    </nav>

    <section id="about">
      <h2>About Us</h2>
      <p>
        We are a student technology club learning how to build useful things on
        the web.
      </p>
    </section>

    <section id="events">
      <h2>Upcoming Events</h2>
      <article>
        <ul>
          <li>
            <h3>HTML Workshop</h3>
            <p>Saturday at 10am</p>
          </li>

          <li>
            <h3>Git Practice</h3>
            <p>Sunday at 2pm</p>
          </li>
        </ul>
      </article>
    </section>

    <section id="join">
      <img src="club.jpg" alt="club-image" />
      <h2>Join the Club</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" />

        <label for="email">Email:</label>
        <input type="email" id="email" />

        <label for="reason">Why do you want to join?</label>
        <textarea type="text" id="reason" maxlength="150"></textarea>

        <button type="submit">Send</button>
      </form>
    </section>

    <footer>&copy; Tech Club 2026</footer>
  </body>
</html>
